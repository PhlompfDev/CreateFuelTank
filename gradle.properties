org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Create 6.0.10 requires >= 21.1.219; built against 21.1.248.
neo_version=21.1.248
loader_version_range=[1,)

mod_id=createfueltank
mod_name=Create: Fuel Tank
mod_license=MIT
mod_version=0.4.0
mod_group_id=com.createfueltank
mod_authors=Plomph
mod_description=A fluid tank that feeds adjacent Diesel Generators engines and Create Propulsion thrusters on its own, plus a Differential that splits rotation without reversing it. Vehicle parts for Create.

# Create (maven.createmod.net, "slim" classifier = without nested Flywheel/Ponder/Registrate)
create_version=6.0.10-281
create_version_range=[6.0.10,6.1.0)
# Ponder and Flywheel (maven.createmod.net) - the versions Create 6.0.10 bundles
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
# Registrate is vendored from Create's jarjar into libs/ (no public maven for the MC1.21 line)
registrate_version=MC1.21-1.3.0+67
# Create Diesel Generators (Modrinth maven)
cdg_version=1.21.1-1.3.15
cdg_version_range=[1.21.1-1.3.15,)
# Create Propulsion: Simulated (Modrinth maven), optional. 1.1.5 is the first release where both
# liquid thrusters expose their tank on a null capability side with a fuel validator attached.
propulsion_version=1.1.5
propulsion_version_range=[1.1.5,)
# Sable and the Aeronautics bundle (which carries Simulated) are only needed to run Create
# Propulsion in the dev runtime / game tests: Propulsion touches Simulated's classes on load.
sable_version=2.0.5+mc1.21.1
aeronautics_version=1.3.2+mc1.21.1
